name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Convex types
        # src/component/_generated/ is gitignored; typecheck/test/build all need it.
        # Codegen is fully local but the convex CLI requires CONVEX_DEPLOYMENT to
        # be set as a sanity check — a dummy value satisfies it without making
        # any network calls.
        env:
          CONVEX_DEPLOYMENT: anonymous:ci-codegen
        run: npx convex codegen --component-dir ./src/component --typecheck disable

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
